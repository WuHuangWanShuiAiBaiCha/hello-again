<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Watch</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/series.css">
  <style>
    .watch-series-page {
      min-height: 100%;
      background: rgb(242, 241, 246);
    }

    .watch-series-page .series-dock {
      position: sticky;
      top: 0;
    }

    .watch-frame {
      width: 100%;
      height: calc(100svh - var(--shared-dock-visual-height));
      border: 0;
      background: #fff;
      display: block;
    }

    .watch-frame-shell {
      position: relative;
      height: calc(100svh - var(--shared-dock-visual-height));
      background: #fff;
      overflow: hidden;
    }

    .watch-frame-shell .watch-frame {
      height: 100%;
    }

    .watch-placeholder {
      min-height: calc(100svh - var(--shared-dock-visual-height));
      display: grid;
      place-items: center;
      padding: 48px 24px;
      color: rgba(28, 28, 31, 0.92);
      background: rgb(242, 241, 246);
    }

    .watch-placeholder__panel {
      width: min(680px, 100%);
      padding: 34px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.48)),
        rgba(245, 245, 247, 0.86);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 28px 60px rgba(24, 24, 28, 0.08);
    }

    .watch-placeholder__eyebrow {
      font: 600 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(28, 28, 31, 0.54);
    }

    .watch-placeholder__title {
      margin: 14px 0 0;
      font: 500 clamp(30px, 4vw, 48px)/1.05 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      color: rgba(18, 18, 20, 0.94);
    }

    .watch-placeholder__copy {
      margin: 18px 0 0;
      font: 400 17px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: rgba(28, 28, 31, 0.64);
    }

    .watch-series-dock__inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 30px;
    }

    .watch-series-home,
    .watch-series-count {
      pointer-events: auto;
      color: rgba(28, 28, 31, 0.82);
      text-decoration: none;
      font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    .watch-series-count {
      color: rgba(28, 28, 31, 0.54);
    }
  </style>
</head>
<body>
  <section class="series-shell is-open" id="series-shell" aria-hidden="false" data-return-url="../index.html" data-initial-panel="1" data-panel-last="3">
    <div class="series-track" id="series-track">
      <div class="series-panel series-panel--sentinel" aria-hidden="true"></div>

      <section class="series-panel series-panel--plain" aria-label="Apple Watch Series 7">
        <div class="series-panel__scroller watch-series-page" data-series-scroll>
          <div class="series-dock series-dock--apple-modern">
            <span class="series-dock__rail"></span>
            <div class="watch-series-dock__inner">
              <a class="watch-series-home" href="../index.html">Home</a>
              <span class="watch-series-count">1 / 3</span>
            </div>
          </div>
          <div class="watch-frame-shell">
            <iframe class="watch-frame" src="./pages/applewatch7-cn/index.html" title="Apple Watch Series 7 精选中文页面"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="Apple Watch image page">
        <div class="series-panel__scroller watch-series-page" data-series-scroll>
          <div class="series-dock series-dock--apple-modern">
            <span class="series-dock__rail"></span>
            <div class="watch-series-dock__inner">
              <a class="watch-series-home" href="../index.html">Home</a>
              <span class="watch-series-count">2 / 3</span>
            </div>
          </div>
          <div class="watch-frame-shell">
            <iframe class="watch-frame" src="./pages/apple-watch-web/index.html" title="Apple Watch 网页"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="Apple Watch showcase page">
        <div class="series-panel__scroller watch-series-page" data-series-scroll>
          <div class="series-dock series-dock--apple-modern">
            <span class="series-dock__rail"></span>
            <div class="watch-series-dock__inner">
              <a class="watch-series-home" href="../index.html">Home</a>
              <span class="watch-series-count">3 / 3</span>
            </div>
          </div>
          <div class="watch-frame-shell">
            <iframe class="watch-frame" src="./pages/apple-watch-web-2/index.html" title="Apple Watch 网页 2"></iframe>
          </div>
        </div>
      </section>
    </div>
  </section>

  <script defer src="../scripts/config.js"></script>
  <script defer src="../scripts/dom.js"></script>
  <script defer src="../scripts/utils.js"></script>
  <script defer src="../scripts/series-shell.js"></script>
  <script defer src="../scripts/watch-series-page.js"></script>
</body>
</html>
