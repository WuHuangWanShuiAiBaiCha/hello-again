<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mac</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/device-page.css">
</head>
<body class="device-page-body device-page-body--light">
  <div class="device-page device-page--mac">
    <div class="device-page__scroll">
      <div class="series-dock series-dock--apple-modern">
        <span class="series-dock__rail"></span>
        <a class="device-page__home" href="../">Home</a>
      </div>
      <div class="detail-page__inner--mac">
        <div class="mac-stage" id="mac-stage">
          <div class="detail-scene" aria-label="Mac Unicorn Studio Scene">
            <div class="detail-scene-frame">
              <div id="mac-detail-scene"></div>
            </div>
            <button class="mac-scene-hitarea" id="mac-scene-hitarea" type="button" aria-label="Open classic Macintosh system"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.6/dist/unicornStudio.umd.js"></script>
  <script defer src="../scripts/config.js"></script>
  <script defer src="../scripts/scenes.js"></script>
  <script defer src="../scripts/mac-page.js"></script>
</body>
</html>
