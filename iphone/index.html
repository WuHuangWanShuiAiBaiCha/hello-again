<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/device-page.css">
</head>
<body class="device-page-body device-page-body--light">
  <div class="device-page device-page--video">
    <div class="device-page__scroll device-page__scroll--video" data-video-scroll>
      <div class="series-dock series-dock--apple-modern">
        <span class="series-dock__rail"></span>
        <a class="device-page__home" href="../">Home</a>
      </div>
      <div class="aqua-page-layer__inner series-video-page">
        <div class="series-video-page__stage">
          <div class="series-video-page__fade series-video-page__fade--top" aria-hidden="true"></div>
          <video
            class="series-video-page__video"
            playsinline
            loop
            preload="auto"
          >
            <source src="../assets/videos/series-page-three.mp4" type="video/mp4">
          </video>
          <div class="series-video-page__fade series-video-page__fade--bottom" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </div>

  <script defer src="../scripts/video-page.js"></script>
</body>
</html>
