<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/series.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      overflow: hidden;
    }

    .iphone-series-shell .series-track {
      overflow-x: auto;
      scroll-behavior: smooth;
      touch-action: pan-x pan-y;
    }

    .iphone-series-page,
    .iphone-frame-shell,
    .iphone-frame {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .iphone-series-page {
      overflow: hidden;
    }

    .iphone-frame-shell {
      position: relative;
      overflow: hidden;
    }

    .iphone-frame {
      display: block;
      border: 0;
    }

  </style>
</head>
<body>
  <section class="series-shell iphone-series-shell is-open" id="series-shell" aria-hidden="false" data-return-url="../index.html" data-initial-panel="1" data-panel-last="5">
    <div class="series-track" id="series-track">
      <div class="series-panel series-panel--sentinel" aria-hidden="true"></div>

      <section class="series-panel series-panel--plain" aria-label="iPhone 4S">
        <div class="iphone-series-page" data-series-scroll>
          <div class="iphone-frame-shell">
            <iframe class="iphone-frame" src="./pages/iphone4/index.html" title="iPhone 4S" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPhone 6">
        <div class="iphone-series-page" data-series-scroll>
          <div class="iphone-frame-shell">
            <iframe class="iphone-frame" src="./iphone6.html" title="iPhone 6" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPhone X">
        <div class="iphone-series-page" data-series-scroll>
          <div class="iphone-frame-shell">
            <iframe class="iphone-frame" src="./iphonex.html" title="iPhone X" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPhone 13 Pro">
        <div class="iphone-series-page" data-series-scroll>
          <div class="iphone-frame-shell">
            <iframe class="iphone-frame" src="./pages/iphone13pro.html" title="iPhone 13 Pro" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPhone Air">
        <div class="iphone-series-page" data-series-scroll>
          <div class="iphone-frame-shell">
            <iframe class="iphone-frame" src="./pages/iphone-air-site/index.html" title="iPhone Air" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>
    </div>
  </section>

  <script defer src="../scripts/config.js"></script>
  <script defer src="../scripts/dom.js"></script>
  <script defer src="../scripts/utils.js"></script>
  <script defer src="../scripts/series-shell.js"></script>
  <script defer src="../scripts/iphone-series-page.js"></script>
</body>
</html>
