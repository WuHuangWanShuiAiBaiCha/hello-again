<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone X</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #1d1d1f;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      min-width: 1200px;
    }

    .page {
      width: 100%;
      overflow-x: auto;
      background: #fff;
    }

    .poster {
      width: 100%;
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="poster" aria-label="iPhone X 页面">
      <img src="./iphone-x-site/7047eacb46464619e826c6e7a467878f.jpg" alt="iPhone X">
    </section>
  </main>
</body>
</html>
