<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone Air</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --muted: #6e7c8f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: var(--text);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    body {
      min-width: 1200px;
    }

    .page {
      width: 100%;
      overflow-x: auto;
    }

    .hero {
      width: 100%;
      background: #fff;
    }

    .hero img,
    .highlights img {
      display: block;
      width: 100%;
      height: auto;
    }

    .highlights {
      width: 100%;
      background: #fff;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="iPhone Air 头图">
      <img src="./0.png" alt="iPhone Air hero" />
    </section>
    <section class="highlights" aria-label="iPhone Air highlights">
      <img src="./1.png" alt="iPhone Air highlights" />
    </section>
  </main>
</body>
</html>
