<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/series.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #fff;
      overflow: hidden;
    }

    .ipad-series-shell .series-track {
      overflow-x: auto;
      scroll-behavior: smooth;
      touch-action: pan-x pan-y;
    }

    .ipad-series-page,
    .ipad-frame-shell,
    .ipad-frame {
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .ipad-series-page {
      overflow: hidden;
    }

    .ipad-frame-shell {
      position: relative;
      overflow: hidden;
    }

    .ipad-frame {
      display: block;
      border: 0;
    }
  </style>
</head>
<body>
  <section class="series-shell ipad-series-shell is-open" id="series-shell" aria-hidden="false" data-return-url="../index.html" data-initial-panel="1" data-panel-last="4">
    <div class="series-track" id="series-track">
      <div class="series-panel series-panel--sentinel" aria-hidden="true"></div>

      <section class="series-panel series-panel--plain" aria-label="iPad mini">
        <div class="ipad-series-page" data-series-scroll>
          <div class="ipad-frame-shell">
            <iframe class="ipad-frame" src="./pages/Ipad01/Ipad01.html" title="iPad mini" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPad Air">
        <div class="ipad-series-page" data-series-scroll>
          <div class="ipad-frame-shell">
            <iframe class="ipad-frame" src="./pages/Ipad02/Ipad02.html" title="iPad Air" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPad Pro">
        <div class="ipad-series-page" data-series-scroll>
          <div class="ipad-frame-shell">
            <iframe class="ipad-frame" src="./pages/Ipad03/Ipad03.html" title="iPad Pro" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="series-panel series-panel--plain" aria-label="iPad">
        <div class="ipad-series-page" data-series-scroll>
          <div class="ipad-frame-shell">
            <iframe class="ipad-frame" src="./pages/Ipad04/Ipad04.html" title="iPad" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
      </section>
    </div>
  </section>

  <script defer src="../scripts/config.js"></script>
  <script defer src="../scripts/dom.js"></script>
  <script defer src="../scripts/utils.js"></script>
  <script defer src="../scripts/series-shell.js"></script>
  <script defer src="../scripts/series-swipe.js"></script>
  <script defer src="../scripts/ipad-series-page.js"></script>
</body>
</html>
